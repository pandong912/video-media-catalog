name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.7"
          enable-cache: true
      - run: uv sync --frozen --all-extras
      - run: make verify-ci

  # Worker and EMR public bases are rate-limited from PR runners, while the
  # catalog CI role trust does not allow pull_request OIDC subjects. Verify the
  # no-network private worker overlay on main and through publish.yml instead.
  container:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_MEDIA_CATALOG_CI_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
          role-session-name: media-catalog-ci-worker-${{ github.run_id }}
      - uses: aws-actions/amazon-ecr-login@v2
      - name: Verify worker overlay dependency lock
        run: |
          sha256sum --check --strict <<'EOF'
          6290421a78020fe14ef81505ae96bbc5048511b9ff8120847027f3f1baefa7c6  pyproject.toml
          32a73a14986be13d19957523ab83717174973139e06bce3b1e713ea830d7c4d8  uv.lock
          EOF
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.release
          push: false
          platforms: linux/amd64
          build-args: >-
            WORKER_BASE_IMAGE=209479308066.dkr.ecr.us-east-1.amazonaws.com/video-media-catalog@sha256:362d556ba623d5ed44f3e9600de0cd223ae860b777ca3706e13fbffa88fd8028
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # EMR Serverless base pulls hit public.ecr.aws 429 from PR runners, and the
  # catalog CI role trust does not allow pull_request OIDC subjects. Validate
  # Dockerfile.emr on main (private ECR) and via publish.yml instead.
  container-emr:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_MEDIA_CATALOG_CI_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
          role-session-name: media-catalog-ci-emr-${{ github.run_id }}
      - uses: aws-actions/amazon-ecr-login@v2
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.emr
          push: false
          platforms: linux/amd64
          build-args: >-
            EMR_BASE_IMAGE=public.ecr.aws/emr-serverless/spark/emr-7.10.0@sha256:c612b1190b418da1163d1676c8c6903280d598e4c0d5ecccfbd8ebd8d228fd46
          cache-from: type=gha
          cache-to: type=gha,mode=max
