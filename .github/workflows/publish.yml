name: Publish image

on:
  workflow_dispatch:
    inputs:
      skip_verify:
        description: Publish images without running verification
        required: false
        default: false
        type: boolean
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}

jobs:
  verify:
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.skip_verify }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.7"
          enable-cache: true
      - run: uv sync --frozen --all-extras
      - run: make verify-ci

  publish:
    needs: verify
    if: >-
      ${{
        always() &&
        (
          needs.verify.result == 'success' ||
          (github.event_name == 'workflow_dispatch' && inputs.skip_verify)
        )
      }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - repository: video-media-catalog
            dockerfile: Dockerfile.release
            tag_prefix: sha
            release_prefix: ""
            artifact: video-media-catalog
            # Reuse the last successful private worker runtime (362d556b /
            # sha-af5df4e); prior WORKER_BASE digest was missing from ECR.
            build_args: >-
              WORKER_BASE_IMAGE=209479308066.dkr.ecr.us-east-1.amazonaws.com/video-media-catalog@sha256:362d556ba623d5ed44f3e9600de0cd223ae860b777ca3706e13fbffa88fd8028
          - repository: video-media-catalog
            dockerfile: Dockerfile.emr
            tag_prefix: emr-sha
            release_prefix: emr-
            artifact: video-media-catalog-emr
            # Avoid public.ecr.aws rate limits with the immutable private
            # bootstrap built from the pinned EMR Serverless 7.10 base.
            build_args: >-
              EMR_BASE_IMAGE=209479308066.dkr.ecr.us-east-1.amazonaws.com/video-media-catalog@sha256:4d1a8e496e57d4352530ef69835c744489f64d0727c0284a72ae6b9f8f0c113e
    env:
      ECR_REPOSITORY: ${{ matrix.repository }}
    steps:
      - uses: actions/checkout@v5
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_MEDIA_CATALOG_CI_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: media-catalog-publish-${{ strategy.job-index }}
      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Verify infrastructure-managed repository
        run: aws ecr describe-repositories --repository-names "$ECR_REPOSITORY" >/dev/null
      - name: Verify worker overlay dependency lock
        if: matrix.dockerfile == 'Dockerfile.release'
        run: |
          sha256sum --check --strict <<'EOF'
          6290421a78020fe14ef81505ae96bbc5048511b9ff8120847027f3f1baefa7c6  pyproject.toml
          32a73a14986be13d19957523ab83717174973139e06bce3b1e713ea830d7c4d8  uv.lock
          EOF
      - id: tags
        name: Build immutable tags
        run: |
          image='${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}'
          {
            echo 'values<<EOF'
            echo "${image}:${{ matrix.tag_prefix }}-${GITHUB_SHA}"
            if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
              echo "${image}:${{ matrix.release_prefix }}${GITHUB_REF_NAME}"
            fi
            echo 'EOF'
          } >>"$GITHUB_OUTPUT"
      - id: existing
        name: Resolve existing commit image
        run: |
          digest="$(
            aws ecr describe-images \
              --repository-name "$ECR_REPOSITORY" \
              --image-ids "imageTag=${{ matrix.tag_prefix }}-${GITHUB_SHA}" \
              --query 'imageDetails[0].imageDigest' \
              --output text 2>/dev/null || true
          )"
          if [[ "$digest" == sha256:* ]]; then
            echo "exists=true" >>"$GITHUB_OUTPUT"
            echo "digest=$digest" >>"$GITHUB_OUTPUT"
          else
            echo "exists=false" >>"$GITHUB_OUTPUT"
          fi
      - uses: docker/setup-buildx-action@v3
      - id: build
        name: Build and push immutable image
        if: steps.existing.outputs.exists != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ steps.tags.outputs.values }}
          build-args: ${{ matrix.build_args }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Refresh AWS credentials after long image build
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_MEDIA_CATALOG_CI_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: media-catalog-publish-${{ strategy.job-index }}
      - id: image
        name: Resolve image and scannable platform digests
        env:
          EXISTING_DIGEST: ${{ steps.existing.outputs.digest }}
          BUILT_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          digest="${EXISTING_DIGEST:-$BUILT_DIGEST}"
          if [[ "$digest" != sha256:* ]]; then
            echo "::error::Published image digest is unavailable"
            exit 1
          fi
          image="$(
            aws ecr batch-get-image \
              --repository-name "$ECR_REPOSITORY" \
              --image-ids "imageDigest=$digest" \
              --accepted-media-types \
                application/vnd.oci.image.index.v1+json \
                application/vnd.docker.distribution.manifest.list.v2+json \
                application/vnd.oci.image.manifest.v1+json \
                application/vnd.docker.distribution.manifest.v2+json \
              --query 'images[0]' \
              --output json
          )"
          media_type="$(jq -r '.imageManifestMediaType' <<<"$image")"
          scan_digest="$digest"
          case "$media_type" in
            application/vnd.oci.image.index.v1+json|\
            application/vnd.docker.distribution.manifest.list.v2+json)
              index="$(jq -r '.imageManifest' <<<"$image")"
              scan_digest="$(
                jq -r '
                  first(
                    .manifests[]
                    | select(
                        .platform.os == "linux"
                        and .platform.architecture == "amd64"
                      )
                    | .digest
                  ) // empty
                ' <<<"$index"
              )"
              ;;
          esac
          if [[ "$scan_digest" != sha256:* ]]; then
            echo "::error::Linux/amd64 platform digest is unavailable"
            exit 1
          fi
          echo "digest=$digest" >>"$GITHUB_OUTPUT"
          echo "scan-digest=$scan_digest" >>"$GITHUB_OUTPUT"
      - name: Attach release tag to reused image
        if: startsWith(github.ref, 'refs/tags/v') && steps.existing.outputs.exists == 'true'
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          image="$(
            aws ecr batch-get-image \
              --repository-name "$ECR_REPOSITORY" \
              --image-ids "imageDigest=$IMAGE_DIGEST" \
              --accepted-media-types \
                application/vnd.oci.image.index.v1+json \
                application/vnd.docker.distribution.manifest.list.v2+json \
                application/vnd.oci.image.manifest.v1+json \
                application/vnd.docker.distribution.manifest.v2+json \
              --query 'images[0]' \
              --output json
          )"
          aws ecr put-image \
            --repository-name "$ECR_REPOSITORY" \
            --image-tag "${{ matrix.release_prefix }}${GITHUB_REF_NAME}" \
            --image-manifest "$(jq -r '.imageManifest' <<<"$image")" \
            --image-manifest-media-type "$(
              jq -r '.imageManifestMediaType' <<<"$image"
            )" >/dev/null
      - name: Enforce zero critical findings
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.scan-digest }}
          IMAGE_REF: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}@${{ steps.image.outputs.scan-digest }}
          DOCKERFILE: ${{ matrix.dockerfile }}
          # Same private EMR base used by Dockerfile.emr build-args. When AWS
          # Basic Scanning FAILS because the EMR image exceeds inventory limits,
          # Trivy must not introduce CRITICAL findings beyond this baseline.
          EMR_SCAN_BASELINE_REF: 209479308066.dkr.ecr.us-east-1.amazonaws.com/video-media-catalog@sha256:4d1a8e496e57d4352530ef69835c744489f64d0727c0284a72ae6b9f8f0c113e
        run: |
          set -euo pipefail
          status=
          description=
          for _ in $(seq 1 30); do
            if scan="$(
              aws ecr describe-image-scan-findings \
                --repository-name "$ECR_REPOSITORY" \
                --image-id "imageDigest=$IMAGE_DIGEST" \
                --output json 2>/dev/null
            )"; then
              status="$(jq -r '.imageScanStatus.status' <<<"$scan")"
              description="$(jq -r '.imageScanStatus.description // empty' <<<"$scan")"
              [[ "$status" == COMPLETE ]] && break
              if [[ "$status" == FAILED ]]; then
                break
              fi
            fi
            sleep 10
          done

          if [[ "$status" == COMPLETE ]]; then
            critical="$(jq -r '.imageScanFindings.findingSeverityCounts.CRITICAL // 0' <<<"$scan")"
            (( critical == 0 )) || {
              echo "::error::Runtime image has $critical critical findings"
              exit 1
            }
            exit 0
          fi

          # Amazon EMR Serverless bases regularly exceed Basic Scanning's
          # inventory cap. Fall back to Trivy and fail only on CRITICAL
          # regressions versus the last successful private EMR base.
          if [[ "$DOCKERFILE" == "Dockerfile.emr" \
            && "$status" == "FAILED" \
            && "$description" == *"exceeds the maximum supported with Basic Scanning"* ]]; then
            echo "::warning::ECR Basic Scanning cannot inventory this EMR image; comparing Trivy CRITICAL set to private EMR baseline"
            curl -fsSL "https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh" \
              | sh -s -- -b /usr/local/bin
            export TRIVY_USERNAME=AWS
            export TRIVY_PASSWORD
            TRIVY_PASSWORD="$(aws ecr get-login-password --region "$AWS_REGION")"
            critical_ids() {
              local ref="$1"
              trivy image --scanners vuln --severity CRITICAL --exit-code 0 --format json --quiet "$ref" \
                | jq -r '
                    [.Results[]?.Vulnerabilities[]?
                      | select(.Severity == "CRITICAL")
                      | "\(.VulnerabilityID)|\(.PkgName)|\(.InstalledVersion)"]
                    | unique
                    | sort[]
                  '
            }
            mapfile -t baseline < <(critical_ids "$EMR_SCAN_BASELINE_REF")
            mapfile -t current < <(critical_ids "$IMAGE_REF")
            declare -A baseline_set=()
            for item in "${baseline[@]}"; do
              baseline_set["$item"]=1
            done
            regressions=()
            for item in "${current[@]}"; do
              [[ -n "${baseline_set[$item]:-}" ]] || regressions+=("$item")
            done
            if ((${#regressions[@]} > 0)); then
              {
                echo "::error::EMR image introduces ${#regressions[@]} CRITICAL finding(s) beyond the private EMR baseline"
                printf '%s\n' "${regressions[@]}"
              } >&2
              exit 1
            fi
            echo "EMR Trivy CRITICAL set matches private baseline (${#current[@]} findings; no regressions)"
            exit 0
          fi

          echo "::error::ECR image scan did not complete successfully (status=${status:-missing})"
          [[ -n "$description" ]] && echo "$description" >&2
          exit 1
      - name: Record immutable image reference
        run: |
          printf '%s/%s@%s\n' \
            '${{ steps.ecr.outputs.registry }}' \
            "$ECR_REPOSITORY" \
            '${{ steps.image.outputs.digest }}' \
            > "image-reference-${{ matrix.artifact }}.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-image-reference
          path: image-reference-${{ matrix.artifact }}.txt

  request-gitops-update:
    needs: publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: video-media-catalog*-image-reference
          path: image-references
      - name: Request immutable GitOps digest update
        env:
          GH_TOKEN: ${{ secrets.VIDEO_WORLD_INFRA_DISPATCH_TOKEN }}
        run: |
          worker_reference="$(
            cat image-references/video-media-catalog-image-reference/image-reference-video-media-catalog.txt
          )"
          emr_reference="$(
            cat image-references/video-media-catalog-emr-image-reference/image-reference-video-media-catalog-emr.txt
          )"
          worker_digest="${worker_reference##*@}"
          emr_digest="${emr_reference##*@}"
          [[ "$worker_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$emr_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          jq -n \
            --arg sourceRepository "$GITHUB_REPOSITORY" \
            --arg sourceRevision "$GITHUB_SHA" \
            --arg imageDigest "$worker_digest" \
            --arg emrImageDigest "$emr_digest" \
            '{
              event_type: "media-catalog-research-image-published",
              client_payload: {
                sourceRepository: $sourceRepository,
                sourceRevision: $sourceRevision,
                imageDigest: $imageDigest,
                emrImageDigest: $emrImageDigest
              }
            }' \
            | gh api \
                --method POST \
                repos/pandong912/video-world-infra/dispatches \
                --input -
