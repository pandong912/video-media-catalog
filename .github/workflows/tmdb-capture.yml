name: Capture TMDB research data

# Production TMDB capture moved to the Temporal worker deployed by GitOps
# (namespace media-catalog-research, Temporal namespace vw-media-catalog-research).
# This workflow no longer assumes AWS OIDC or runs docker capture.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    if: github.repository == 'pandong912/video-media-catalog'
    runs-on: ubuntu-latest
    steps:
      - name: Explain Temporal migration
        run: |
          {
            echo "### TMDB research capture"
            echo
            echo "GitHub Actions production capture is retired."
            echo "Use the Temporal schedules / bootstrap Job in"
            echo "\`media-catalog-research\` (task queue \`vw-media-catalog-tmdb-v1\`)."
            echo
            echo "- OpenSearch publication: disabled"
            echo "- Identity / Gold: disabled"
          } >>"$GITHUB_STEP_SUMMARY"
          echo "TMDB capture is orchestrated by Temporal; this workflow is a no-op."
