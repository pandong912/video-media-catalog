[project]
name = "video-media-catalog"
version = "0.1.0"
description = "Deterministic multi-source global film and television research catalog"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Apache-2.0" }
dependencies = [
    "boto3>=1.35,<2",
    "defusedxml>=0.7,<1",
    "pyarrow>=18,<27",
    "pydantic>=2.10,<3",
]

[project.optional-dependencies]
spark = [
    "pyspark==3.5.5",
]
index = [
    "opensearch-py>=2.8,<4",
]
api = [
    "fastapi>=0.115,<1",
    "opensearch-py>=2.8,<4",
    "pyjwt[crypto]>=2.10,<3",
    "uvicorn>=0.34,<1",
]

[project.scripts]
video-media-catalog = "video_media_catalog.cli:main"
video-media-catalog-spark = "video_media_catalog.spark_cli:main"
video-media-catalog-index = "video_media_catalog.index_cli:main"
video-media-catalog-api = "video_media_catalog.api_cli:main"
video-media-catalog-validate = "video_media_catalog.validate_cli:main"
video-media-catalog-wikidata-sync = "video_media_catalog.wikidata_sync_cli:main"
video-media-catalog-wikidata-subset = "video_media_catalog.wikidata_subset_cli:main"
video-media-catalog-reference-subset = "video_media_catalog.reference_subset_cli:main"
video-media-catalog-emr-submit = "video_media_catalog.emr_serverless_cli:main"
video-media-catalog-tvmaze-sync = "video_media_catalog.tvmaze_sync_cli:main"
video-media-catalog-tvmaze-delta-sync = "video_media_catalog.tvmaze_delta_sync_cli:main"
video-media-catalog-v1-adapter = "video_media_catalog.v1_adapter_cli:main"
video-media-catalog-imdb-sync = "video_media_catalog.imdb_sync_cli:main"
video-media-catalog-tmdb-sync = "video_media_catalog.tmdb_sync_cli:main"
video-media-catalog-source-registry = "video_media_catalog.source_registry_cli:main"
video-media-catalog-community-spark = "video_media_catalog.community_cli:main"
video-media-catalog-research-silver = "video_media_catalog.research_silver_cli:main"
video-media-catalog-identity-curation = "video_media_catalog.identity_curation_cli:main"
video-media-catalog-gold-spark = "video_media_catalog.gold_cli:main"
video-media-catalog-gold-index = "video_media_catalog.gold_index_cli:main"
video-media-catalog-gold-index-plan = "video_media_catalog.gold_index_cli:sizing_main"
video-media-catalog-iceberg-maintenance = "video_media_catalog.iceberg_maintenance_cli:main"
video-media-catalog-gold-removal = "video_media_catalog.gold_removal_cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8.3,<10",
    "ruff==0.16.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/video_media_catalog"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = [
    "spark: requires Java and the pyspark optional dependency",
    "integration: requires an explicitly enabled local Iceberg runtime",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.uv]
default-groups = ["dev"]
